<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand-192.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Conexão Óticas" />
    <meta name="theme-color" content="#16a34a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Instalação por app: /?instalar=otica|lab troca o manifest ANTES do navegador
      // avaliar a instalabilidade, para o beforeinstallprompt corresponder ao app certo.
      (function () {
        try {
          var alvo = new URLSearchParams(location.search).get('instalar');
          var href = alvo === 'lab' ? '/manifest-lab.webmanifest'
                   : alvo === 'otica' ? '/manifest-otica.webmanifest' : null;
          if (href) {
            var l = document.querySelector('link[rel="manifest"]');
            if (l) l.setAttribute('href', href);
          }
        } catch (e) { /* silencioso */ }
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Conexão Óticas — Sistema de Gestão</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
